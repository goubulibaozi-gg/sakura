<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Blog</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            touch-action: manipulation;
        }

        html {
            scroll-behavior: smooth;
        }

        html,
        body {
            min-height: 200vh;
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: #0a0d18;
            color: #fff;
            overflow-x: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        /* 全局点击光影波纹容器 */
        .click-ripple {
            position: fixed;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(138,180,248,0.5) 40%, rgba(255,255,255,0) 70%);
            transform: translate(-50%, -50%) scale(0.2);
            pointer-events: none;
            z-index: 9999;
            opacity: 1;
            filter: blur(4px);
            animation: ripple-out 0.6s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes ripple-out {
            to {
                transform: translate(-50%, -50%) scale(2.5);
                opacity: 0;
                filter: blur(12px);
            }
        }

        /* 背景防护层 */
        .bg {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100vh;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
            background: #0a0d18;
            will-change: transform;
            transform: translateZ(0);
        }

        .bg img {
            position: absolute;
            top: -10vh;
            left: 0;
            width: 100%;
            height: 160vh;
            object-fit: cover;
            object-position: center;
            display: block;
            will-change: transform, filter;
            transform: translate3d(0, 0, 0);
            transition: transform 0.1s linear, filter 0.15s ease-out;
            opacity: 1;
            filter: blur(0px);
            backface-visibility: hidden;
        }

        .bg::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0.2),
                rgba(0, 0, 0, 0.5)
            );
            pointer-events: none;
        }

        .glass-nav {
            position: fixed;
            top: 1.2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            width: auto;
            min-width: 16rem;
            height: 2.8rem;
            padding: 0 1.5rem;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.28);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(16px) saturate(160%) url(#frosted);
            -webkit-backdrop-filter: blur(16px) saturate(160%) url(#frosted);
            z-index: 100;
            overflow: hidden;
            isolation: isolate;
        }

        .glass-nav::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(
                180deg,
                rgba(255, 255, 255, 0.15),
                rgba(255, 255, 255, 0.03)
            );
            pointer-events: none;
            z-index: -1;
        }

        .nav-item {
            position: relative;
            color: #fff;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            white-space: nowrap;
            padding: 0.3rem 0.5rem;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
            transition: opacity 0.2s ease, transform 0.2s ease, text-shadow 0.2s ease;
        }

        .nav-item:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
        }

        .hero-cover {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            will-change: transform, filter, opacity;
            transition: filter 0.15s ease-out, transform 0.1s linear, opacity 0.1s linear;
        }

        .avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.4), 0 8px 30px rgba(0, 0, 0, 0.6);
            margin-bottom: 1.2rem;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease;
            animation: avatar-float 4s ease-in-out infinite;
        }

        .avatar:hover {
            transform: scale(1.12) rotate(5deg);
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.8), 0 12px 40px rgba(0, 0, 0, 0.8);
        }

        @keyframes avatar-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .hero-title {
            font-size: 2.5rem;
            font-weight: 600;
            margin: 0;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.6), 0 2px 10px rgba(0, 0, 0, 0.5);
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .scroll-hint {
            position: absolute;
            bottom: 2rem;
            font-size: 0.85rem;
            opacity: 0.8;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
            60% { transform: translateY(-4px); }
        }

        .content {
            position: relative;
            z-index: 1;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            font-size: 1.05rem;
            line-height: 1.8;
            word-break: break-all;
        }

        .info-card {
            padding: 2rem;
            border-radius: 24px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 2rem;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .info-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4), 0 0 20px rgba(255, 255, 255, 0.1);
        }

        .card-title {
            margin-top: 0;
            margin-bottom: 1rem;
            font-size: 1.4rem;
            font-weight: 600;
            color: #fff;
            letter-spacing: 1px;
        }

        .bio-text {
            margin: 0;
            color: rgba(255, 255, 255, 0.9);
            white-space: pre-line;
        }

        /* 防自动换行样式喵 */
        .welcome-title {
            display: inline-block;
            white-space: nowrap;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        /* 照片展示容器样式喵 */
        .card-photo-wrapper {
            width: 100%;
            overflow: hidden;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .card-photo {
            width: 100%;
            height: auto;
            max-height: 480px;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }

        .card-photo-wrapper:hover .card-photo {
            transform: scale(1.03);
        }

        .contact-btn-group {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin-top: 0.5rem;
        }

        .contact-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.8rem 1.2rem;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #fff;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .contact-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3), 0 0 15px rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .contact-btn:active {
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            .glass-nav {
                top: 0.8rem;
                height: 2.4rem;
                min-width: 13rem;
                gap: 1rem;
                padding: 0 1rem;
            }

            .nav-item {
                font-size: 0.85rem;
            }

            .avatar {
                width: 105px;
                height: 105px;
            }

            .hero-title {
                font-size: 2rem;
            }

            .content {
                padding: 1rem;
            }

            .welcome-title {
                font-size: 0.9em;
            }
            
            .contact-btn {
                font-size: 0.88rem;
                padding: 0.7rem 1rem;
            }
        }
    </style>
</head>

<body>

    <svg style="position:absolute; width:0; height:0; overflow:hidden;" aria-hidden="true">
        <defs>
            <filter id="frosted" x="-20%" y="-20%" width="140%" height="140%">
                <feTurbulence id="turbulence" type="fractalNoise" baseFrequency="0.03" numOctaves="3" result="noise" />
                <feDisplacementMap id="displace" in="SourceGraphic" in2="noise" scale="12" xChannelSelector="R" yChannelSelector="G" />
            </filter>
        </defs>
    </svg>

    <div class="bg">
        <img id="bg-img" src="touxiang.jpg" alt="Background">
    </div>

    <nav class="glass-nav">
        <a href="#about" class="nav-item">个人简介</a>
        <a href="#contact" class="nav-item">联系方式</a>
    </nav>

    <section class="hero-cover" id="hero">
        <img class="avatar" src="beijing.jpg" alt="sakura">
        <h1 class="hero-title">sakura的小窝</h1>
        <div class="scroll-hint">↓ 向下滑动查看更多</div>
    </section>

    <main class="content" id="about">
        <div class="info-card">
            <h2 class="card-title">关于我</h2>
            <p class="bio-text"><span class="welcome-title">✦ Welcome to Sakura's Castle! ✦</span>
喵！这里是 sakura 的日常沉淀与思维碎碎念。
喜欢探索各种好玩的技术、打打游戏、沉浸在废萌 ACG 的世界里。
保持好奇，热爱生活，希望在这个小小的个人空间里，能带给你一丝温暖与乐趣喵！(ฅ'ω'ฅ)</p>
        </div>
        <div class="info-card">
            <div class="card-photo-wrapper">
                <img class="card-photo" src="1782493803908.png" alt="Photo">
            </div>
        </div>
      
        <div class="info-card" id="contact">
            <h2 class="card-title">联系方式</h2>
            <div class="contact-btn-group">
                <a href="https://x.com/Sakura39mc" class="contact-btn" target="_blank">
                    🌐 X (Twitter): @Sakura39mc
                </a>
                <a href="mailto:baozimiao356@gmail.com" class="contact-btn" target="_blank">
                    📧 baozimiao356@gmail.com
                </a>
                <a href="https://t.me/Sakura_JM" class="contact-btn" target="_blank">
                    ✈️ Telegram: @Sakura_JM
                </a>
                <a href="https://www.coolapk.com/u/31107338" class="contact-btn" target="_blank">
                    📱 酷安主页
                </a>
            </div>
        </div>
    </main>

    <script>
        const bgImg = document.getElementById("bg-img");
        const hero = document.getElementById("hero");
        const turbulence = document.getElementById("turbulence");

        bgImg.addEventListener("error", () => {
            if (!bgImg.dataset.fallback) {
                bgImg.dataset.fallback = "true";
                bgImg.src = "https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=2400&q=90";
            }
        });

        /* 全局点击光影特效 */
        window.addEventListener("click", (e) => {
            const ripple = document.createElement("div");
            ripple.className = "click-ripple";
            ripple.style.left = `${e.clientX}px`;
            ripple.style.top = `${e.clientY}px`;
            document.body.appendChild(ripple);

            setTimeout(() => {
                ripple.remove();
            }, 600);
        });

        /* 滚动高斯/动态模糊 */
        let ticking = false;
        let lastScrollY = 0;

        window.addEventListener("scroll", () => {
            if (!ticking) {
                window.requestAnimationFrame(() => {
                    const scrolled = window.scrollY;
                    const deltaY = Math.abs(scrolled - lastScrollY);
                    
                    const motionBlur = Math.min(deltaY * 0.1, 6);
                    const distanceBlur = Math.min(scrolled * 0.015, 12);
                    const totalBlur = motionBlur + distanceBlur;

                    bgImg.style.transform = `translate3d(0, -${scrolled * 0.08}px, 0)`;
                    bgImg.style.filter = `blur(${totalBlur.toFixed(1)}px)`;

                    if (scrolled <= window.innerHeight) {
                        const heroBlur = scrolled * 0.02;
                        const heroOpacity = 1 - (scrolled / (window.innerHeight * 0.8));
                        const heroScale = 1 - (scrolled * 0.0005);
                        
                        hero.style.filter = `blur(${heroBlur.toFixed(1)}px)`;
                        hero.style.opacity = Math.max(heroOpacity, 0);
                        hero.style.transform = `translate3d(0, ${scrolled * 0.3}px, 0) scale(${Math.max(heroScale, 0.9)})`;
                    }

                    if (turbulence) {
                        const frequency = 0.03 + (scrolled % 100) * 0.00015;
                        turbulence.setAttribute("baseFrequency", frequency);
                    }

                    lastScrollY = scrolled;
                    ticking = false;
                });
                ticking = true;
            }
        }, { passive: true });
    </script>

</body>
</html>
